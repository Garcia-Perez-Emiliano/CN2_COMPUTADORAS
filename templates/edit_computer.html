{% extends 'base.html' %}

{% block content %}
<div class="columns is-centered">
    <div class="column is-6">
        <div class="card p-5" style="border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 class="title is-3 mb-4">Actualizar Computadora</h2>
            <form action="{{ url_for('edit_computer', id=computer.id) }}" method="post">
                <div class="field">
                    <label class="label">Marca</label>
                    <div class="control select is-fullwidth">
                        <select name="brand_id" required>
                            {% for b in brands %}
                            <option value="{{ b.id }}" {% if b.id == computer.brand_id %}selected{% endif %}>
                                {{ b.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Modelo</label>
                    <div class="control">
                        <input class="input" type="text" name="model" value="{{ computer.model }}" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Procesador</label>
                    <div class="control">
                        <input class="input" type="text" name="processor" value="{{ computer.processor }}" required>
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label">Memoria RAM</label>
                            <div class="control">
                                <input class="input" type="text" name="ram" value="{{ computer.ram }}" required>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label">Almacenamiento</label>
                            <div class="control">
                                <input class="input" type="text" name="storage" value="{{ computer.storage }}" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="buttons mt-5">
                    <button class="button is-warning" type="submit">Actualizar Cambios</button>
                    <a class="button is-light" href="{{ url_for('index') }}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
