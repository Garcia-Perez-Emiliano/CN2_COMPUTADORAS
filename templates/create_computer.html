{% extends 'base.html' %}

{% block content %}
<div class="columns is-centered">
    <div class="column is-6">
        <div class="card p-5" style="border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 class="title is-3 mb-4">Nueva Computadora</h2>
            <form action="{{ url_for('add_computer') }}" method="post">
                <div class="field">
                    <label class="label">Marca</label>
                    <div class="control select is-fullwidth">
                        <select name="brand_id" required>
                            {% for b in brands %}
                            <option value="{{ b.id }}">{{ b.name }}</option>
                            {% else %}
                            <option value="1">HP</option>
                            <option value="2">Dell</option>
                            <option value="3">Lenovo</option>
                            <option value="4">Apple</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Modelo</label>
                    <div class="control">
                        <input class="input" type="text" name="model" placeholder="Ej. ThinkPad E14" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Procesador</label>
                    <div class="control">
                        <input class="input" type="text" name="processor" placeholder="Ej. AMD Ryzen 7 5700U" required>
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="field">
                            <label class="label">Memoria RAM</label>
                            <div class="control">
                                <input class="input" type="text" name="ram" placeholder="Ej. 16 GB" required>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="field">
                            <label class="label">Almacenamiento</label>
                            <div class="control">
                                <input class="input" type="text" name="storage" placeholder="Ej. 1 TB SSD" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="buttons mt-5">
                    <button class="button is-primary" type="submit">Guardar Equipo</button>
                    <a class="button is-light" href="{{ url_for('index') }}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
